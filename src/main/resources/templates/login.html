<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Online Voting System</title>

    <style>
        :root {
            --navy: #0b1534;
            --yellow: #facc15;
            --sky: #dbeafe;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            overflow-x: hidden;
            background:
                    radial-gradient(circle at 12% 15%, rgba(96, 165, 250, 0.42), transparent 28rem),
                    radial-gradient(circle at 90% 82%, rgba(250, 204, 21, 0.17), transparent 26rem),
                    linear-gradient(135deg, var(--navy), #1d4ed8);
            color: white;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: min(1180px, 100%);
            margin: 0 auto;
            padding: 24px 32px;
        }

        .logo {
            font-size: 1.35rem;
            font-weight: 800;
            letter-spacing: -0.04em;
        }

        .logo span {
            color: var(--yellow);
        }

        .login-btn,
        .btn {
            font-weight: 800;
            text-decoration: none;
            transition: transform 180ms ease, box-shadow 180ms ease, background-color 180ms ease, border-color 180ms ease;
        }

        .login-btn {
            padding: 0.7rem 1.2rem;
            border-radius: 999px;
            background: var(--yellow);
            color: #111827;
        }

        .login-btn:hover,
        .login-btn:focus-visible {
            background: #fde047;
            box-shadow: 0 10px 24px rgba(250, 204, 21, 0.28);
            transform: translateY(-2px);
        }

        .login-btn:focus-visible,
        .btn:focus-visible {
            outline: 3px solid white;
            outline-offset: 4px;
        }

        main {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 91px);
            padding: 40px 20px 60px;
        }

        .login-container {
            width: min(100%, 420px);
            animation: enter 600ms ease-out both;
        }

        @keyframes enter {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-card {
            padding: 2.25rem 2rem;
            border: 1px solid rgba(219, 234, 254, 0.18);
            border-radius: 1.25rem;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
        }

        .form-card h2 {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            margin-bottom: 0.5rem;
            text-align: center;
        }

        .form-card h2 span {
            color: var(--yellow);
        }

        .form-card p {
            color: var(--sky);
            font-size: 0.95rem;
            text-align: center;
            margin-bottom: 1.5rem;
        }

        /* Alert notifications */
        .alert {
            padding: 0.75rem 1rem;
            border-radius: 0.6rem;
            font-size: 0.88rem;
            margin-bottom: 1.25rem;
            text-align: left;
        }

        .alert-danger {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #fca5a5;
        }

        .alert-success {
            background: rgba(34, 197, 94, 0.2);
            border: 1px solid rgba(34, 197, 94, 0.4);
            color: #86efac;
        }

        .alert-info {
            background: rgba(59, 130, 246, 0.2);
            border: 1px solid rgba(59, 130, 246, 0.4);
            color: #93c5fd;
        }

        .form-group {
            margin-bottom: 1.25rem;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.4rem;
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--sky);
        }

        .form-control {
            width: 100%;
            padding: 0.8rem 1rem;
            border-radius: 0.6rem;
            border: 1px solid rgba(219, 234, 254, 0.25);
            background: rgba(11, 21, 52, 0.6);
            color: white;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 180ms ease, box-shadow 180ms ease;
        }

        .form-control:focus {
            border-color: var(--yellow);
            box-shadow: 0 0 0 3px rgba(250, 204, 21, 0.2);
        }

        .form-control::placeholder {
            color: rgba(219, 234, 254, 0.4);
        }

        .btn-submit {
            position: relative;
            display: block;
            width: 100%;
            padding: 0.95rem;
            border: none;
            border-radius: 0.75rem;
            background: var(--yellow);
            color: #111827;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            overflow: hidden;
            box-shadow: 0 12px 25px rgba(250, 204, 21, 0.25);
            transition: transform 180ms ease, box-shadow 180ms ease, background-color 180ms ease;
            margin-top: 1.5rem;
        }

        .btn-submit:hover {
            background: #fde047;
            transform: translateY(-3px);
            box-shadow: 0 18px 32px rgba(250, 204, 21, 0.36);
        }

        .form-footer {
            margin-top: 1.5rem;
            text-align: center;
            font-size: 0.9rem;
            color: var(--sky);
        }

        .form-footer a {
            color: var(--yellow);
            font-weight: 700;
            text-decoration: none;
            margin-left: 0.3rem;
        }

        .form-footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 700px) {
            nav { padding: 20px; }
            main { padding: 24px 16px 40px; }
            .form-card { padding: 1.75rem 1.25rem; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>

<nav>
    <div class="logo">
        <a th:href="@{/}" style="color: inherit; text-decoration: none;">Vote<span>Online</span></a>
    </div>
    <a th:href="@{/register}" class="login-btn">Register</a>
</nav>

<main>
    <div class="login-container">
        <div class="form-card">
            <h2>Welcome <span>Back</span></h2>
            <p>Log in to access your voting portal</p>

            <!-- Notification Messages -->
            <div th:if="${param.error}" class="alert alert-danger">
                Invalid username or password. Please try again.
            </div>
            <div th:if="${param.registered}" class="alert alert-success">
                Account created successfully! Please log in.
            </div>
            <div th:if="${param.logout}" class="alert alert-info">
                You have been logged out safely.
            </div>

            <!-- Login Form -->
            <form th:action="@{/login}" method="post">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" class="form-control" placeholder="Enter your username" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required>
                </div>

                <button type="submit" class="btn-submit">Sign In</button>
            </form>

            <div class="form-footer">
                Don't have an account?
                <a th:href="@{/register}">Register here</a>
            </div>
        </div>
    </div>
</main>

</body>
</html>
