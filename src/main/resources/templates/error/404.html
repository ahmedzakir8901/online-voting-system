<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>404 - Page Not Found</title>
    <style>
        body {
            background: #0b1534;
            color: white;
            font-family: system-ui, sans-serif;
            display: flex;
            height: 100vh;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        h1 { font-size: 5rem; color: #facc15; margin-bottom: 0.5rem; }
        p { color: #dbeafe; font-size: 1.2rem; margin-bottom: 1.5rem; }
        a { color: #111827; background: #facc15; padding: 0.75rem 1.5rem; border-radius: 0.5rem; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
<div>
    <h1>404</h1>
    <p>Oops! The page you are looking for does not exist.</p>
    <a href="/dashboard">Return to Dashboard</a>
</div>
</body>
</html>
