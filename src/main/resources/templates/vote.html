<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cast Your Vote - Online Voting System</title>

    <style>
        :root {
            --navy: #0b1534;
            --yellow: #facc15;
            --sky: #dbeafe;
            --emerald: #10b981;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        body {
            min-height: 100vh;
            overflow-x: hidden;
            background:
                    radial-gradient(circle at 12% 15%, rgba(96, 165, 250, 0.42), transparent 28rem),
                    radial-gradient(circle at 90% 82%, rgba(250, 204, 21, 0.17), transparent 26rem),
                    linear-gradient(135deg, var(--navy), #1d4ed8);
            color: white;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: min(1180px, 100%);
            margin: 0 auto;
            padding: 24px 32px;
        }

        .logo {
            font-size: 1.35rem;
            font-weight: 800;
            letter-spacing: -0.04em;
        }

        .logo span {
            color: var(--yellow);
        }

        .user-greeting {
            color: var(--sky);
            font-size: 0.95rem;
        }

        .logout-btn {
            padding: 0.5rem 1rem;
            border-radius: 999px;
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #fca5a5;
            font-weight: 700;
            font-size: 0.85rem;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .logout-btn:hover {
            background: var(--danger);
            color: white;
        }

        main {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 91px);
            padding: 40px 20px 60px;
        }

        .vote-card-wrapper {
            width: min(100%, 540px);
            animation: enter 500ms ease-out both;
        }

        @keyframes enter {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card {
            padding: 2.5rem 2rem;
            border: 1px solid rgba(219, 234, 254, 0.18);
            border-radius: 1.25rem;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
        }

        .card-header {
            text-align: center;
            margin-bottom: 1.75rem;
        }

        .card-header h2 {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            margin-bottom: 0.4rem;
        }

        .card-header h2 span {
            color: var(--yellow);
        }

        .card-header p {
            color: var(--sky);
            font-size: 0.92rem;
        }

        /* Candidate Details Box */
        .candidate-summary {
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(250, 204, 21, 0.3);
            border-radius: 0.9rem;
            padding: 1.25rem;
            margin-bottom: 1.5rem;
        }

        .candidate-summary label {
            text-transform: uppercase;
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 0.05em;
            color: var(--sky);
            display: block;
            margin-bottom: 0.25rem;
        }

        .candidate-name {
            font-size: 1.35rem;
            font-weight: 800;
            color: white;
            margin-bottom: 0.2rem;
        }

        .candidate-party {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--yellow);
            margin-bottom: 0.6rem;
        }

        .candidate-desc {
            font-size: 0.88rem;
            color: var(--sky);
            line-height: 1.5;
        }

        /* Confirmation Box */
        .confirm-checkbox {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(219, 234, 254, 0.15);
            border-radius: 0.75rem;
            padding: 1rem;
            margin-bottom: 1.75rem;
            cursor: pointer;
        }

        .confirm-checkbox input[type="checkbox"] {
            margin-top: 3px;
            width: 18px;
            height: 18px;
            accent-color: var(--yellow);
            cursor: pointer;
        }

        .confirm-checkbox label {
            font-size: 0.88rem;
            color: var(--sky);
            line-height: 1.4;
            cursor: pointer;
        }

        .actions {
            display: flex;
            gap: 12px;
        }

        .btn {
            flex: 1;
            padding: 0.85rem;
            border-radius: 0.75rem;
            font-size: 0.95rem;
            font-weight: 800;
            border: none;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            transition: transform 180ms ease, box-shadow 180ms ease, background-color 180ms ease;
        }

        .btn-confirm {
            background: var(--yellow);
            color: #111827;
            box-shadow: 0 10px 20px rgba(250, 204, 21, 0.25);
        }

        .btn-confirm:hover {
            background: #fde047;
            transform: translateY(-2px);
            box-shadow: 0 14px 28px rgba(250, 204, 21, 0.36);
        }

        .btn-cancel {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(219, 234, 254, 0.3);
            color: white;
        }

        .btn-cancel:hover {
            background: rgba(255, 255, 255, 0.18);
            transform: translateY(-2px);
        }

        .error-message {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.5);
            color: #fca5a5;
            padding: 0.75rem;
            border-radius: 0.6rem;
            font-size: 0.88rem;
            margin-bottom: 1.25rem;
            text-align: center;
        }

        @media (max-width: 700px) {
            nav { padding: 20px; }
            main { padding: 24px 16px 40px; }
            .card { padding: 2rem 1.5rem; }
            .actions { flex-direction: column; }
        }
    </style>
</head>
<body>

<nav>
    <div class="logo">
        <a th:href="@{/dashboard}" style="color: inherit; text-decoration: none;">Vote<span>Online</span></a>
    </div>

    <div style="display: flex; align-items: center; gap: 15px;">
        <span class="user-greeting">Voter: <strong th:text="${username}">Voter</strong></span>
        <a th:href="@{/logout}" class="logout-btn">Logout</a>
    </div>
</nav>

<main>
    <div class="vote-card-wrapper">
        <div class="card">
            <div class="card-header">
                <h2>Confirm Your <span>Vote</span></h2>
                <p>Please review your selection before casting your official vote.</p>
            </div>

            <!-- Error Banner -->
            <div th:if="${error}" class="error-message" th:text="${error}"></div>

            <!-- Form Submits to /vote controller endpoint -->
            <form th:action="@{/vote}" method="post">

                <!-- Hidden Candidate ID Passed from Dashboard -->
                <input type="hidden" name="candidateId" th:value="${candidate.id}" />

                <!-- Selected Candidate Summary Display -->
                <div class="candidate-summary">
                    <label>Selected Candidate</label>
                    <div class="candidate-name" th:text="${candidate.name}">Ahmed Loru</div>
                    <div class="candidate-party" th:text="${candidate.party}">Pakistan Peoples Party</div>
                    <div class="candidate-desc" th:text="${candidate.description}">Focusing on Development.</div>
                </div>

                <!-- Mandatory Checkbox Confirmation -->
                <div class="confirm-checkbox">
                    <input type="checkbox" id="confirm" name="confirm" required />
                    <label for="confirm">
                        I confirm that this choice is final. I understand that my vote cannot be modified after submission.
                    </label>
                </div>

                <!-- Action Buttons -->
                <div class="actions">
                    <button type="submit" class="btn btn-confirm">Confirm & Submit Vote</button>
                    <a th:href="@{/dashboard}" class="btn btn-cancel">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</main>

</body>
</html>
