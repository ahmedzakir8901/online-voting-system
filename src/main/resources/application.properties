spring.application.name=online-voting-system

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/online_voting_system?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=ahmedhuria
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Optional (MySQL Dialect)
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Server Configuration
server.port=8080

# Disable Thymeleaf Caching (Instantly reloads HTML changes on browser refresh)
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Enable Spring Boot DevTools Live Reload
spring.devtools.livereload.enabled=true